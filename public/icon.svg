<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bg)"/>
  <!-- Document / blueprint -->
  <rect x="58" y="48" width="140" height="160" rx="10" fill="#ffffff" opacity="0.95"/>
  <!-- Blueprint lines -->
  <line x1="78" y1="78" x2="178" y2="78" stroke="#1e40af" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <line x1="78" y1="100" x2="160" y2="100" stroke="#1e40af" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <line x1="78" y1="122" x2="170" y2="122" stroke="#1e40af" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <line x1="78" y1="144" x2="145" y2="144" stroke="#1e40af" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <!-- Engineering gear (small) -->
  <circle cx="168" cy="168" r="28" fill="url(#accent)"/>
  <circle cx="168" cy="168" r="12" fill="#1e3a8a"/>
  <!-- Gear teeth simplified -->
  <rect x="162" y="136" width="12" height="10" rx="2" fill="url(#accent)"/>
  <rect x="162" y="190" width="12" height="10" rx="2" fill="url(#accent)"/>
  <rect x="136" y="162" width="10" height="12" rx="2" fill="url(#accent)"/>
  <rect x="190" y="162" width="10" height="12" rx="2" fill="url(#accent)"/>
  <!-- Approval checkmark -->
  <path d="M78 168 L92 182 L118 152" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
